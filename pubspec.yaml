name: astra_voice_assistant
description: Astra Voice Assistant - voice commands for YouTube, Google, WhatsApp and phone dialer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
